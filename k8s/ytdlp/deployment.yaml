apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytdlp-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytdlp-web
  template:
    metadata:
      labels:
        app: ytdlp-web
    spec:
      containers:
        - name: ytdlp-web
          image: ghcr.io/opencombat-org/ytdlp-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_STORAGE
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ytdlp-data
